mode: paper

strategy:
  type: cross_dex
  triangular: false
  intra_exchange: false

market:
  type: dex_spot
  spot: true
  futures: false
  perpetuals: false
  leverage: 1

capital:
  starting_balance_usdt: 0
  own_capital_usdt: 0
  flash_loan_only: true

arbitrage:
  min_net_profit_usdt: 0.005
  include_trading_fees: true
  include_gas_cost: true
  include_slippage: true
  include_mev_reserve: true
  max_quote_age_ms: 1000
  max_pair_skew_ms: 1000
  quote_deadline_ms: 1000

position:
  sizing: flash_liquidity_dynamic
  dynamic_sizing: true
  min_flash_loan_quote: 100
  max_flash_loan_quote: 1000000000
  compound_realized_pnl: false

execution:
  continuous_scanning: true
  continuous_trading: false
  order_type: market
  leg_timeout_ms: 1500
  hedge_on_partial_fill: false
  live_execution: false
  mev_protection_required: true
  atomic_repayment_required: true

runtime:
  poll_interval_ms: 250
  max_concurrent_pairs: 128
  log_level: INFO
