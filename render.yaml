services:
  - type: web
    name: deriveonlyrender
    runtime: python
    region: frankfurt
    plan: free
    branch: options-engine-demo
    buildCommand: python -m pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt && python -m compileall -q options_engine
    startCommand: python -m options_engine.live_monitor
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: PORT
        value: 10000
      - key: DERIV_AUTH_TOKEN
        sync: false
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_ACCOUNT_ID
        sync: false
      - key: DERIV_ACCOUNT_MODE
        value: demo
      - key: DERIV_LIVE_TRADING_ENABLED
        value: "false"
      - key: DERIV_SYMBOL
        value: 1HZ100V
      - key: DERIV_WS_TIMEOUT
        value: "12"
      - key: OPTIONS_MODE
        value: paper
      - key: OPTIONS_DRY_RUN
        value: "true"
      - key: OPTIONS_TIMEFRAMES
        value: "1,5"
      - key: OPTIONS_STAKE_1M
        value: "0.5"
      - key: OPTIONS_STAKE_5M
        value: "2"
      - key: OPTIONS_MARTINGALE
        value: "false"
      - key: DERIV_AUTO_EXECUTE
        value: "true"
