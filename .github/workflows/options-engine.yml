name: Options Engine Verification
on:
  push:
    branches: [options-engine-demo, main]
  pull_request:
    paths:
      - 'options_engine/**'
      - '.github/workflows/options-engine.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q options_engine
      - name: Unit tests
        run: python -m unittest discover -s options_engine/tests -v
      - name: Paper binary lifecycle smoke run
        run: python -m options_engine.paper_runner
      - name: Deriv public live-data smoke test
        run: python -m options_engine.deriv_live_smoke
      - name: Assert live mode remains locked
        run: |
          python -c "from options_engine.config import Settings;           import sys;           try: Settings(mode='live').validate()           except ValueError: print('LIVE_MODE_LOCKED')           else: sys.exit('LIVE MODE UNEXPECTEDLY ENABLED')"
